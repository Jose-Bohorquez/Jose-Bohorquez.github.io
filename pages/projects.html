  <meta property="og:type" content="website">

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>(function(d){try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))d.classList.add("dark")}catch(e){}if(!matchMedia("(prefers-reduced-motion: reduce)").matches&&"IntersectionObserver"in window){d.classList.add("motion");setTimeout(function(){if(!window.Site)d.classList.remove("motion")},2500)}})(document.documentElement)</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div data-site-header></div>

  <main id="contenido" tabindex="-1">
    <header class="container page-head">
      <h1 data-split>Proyectos y casos de implementación</h1>
      <p class="lead" data-enter style="--i:3">
        Desarrollo web, automatización de procesos e integraciones. Los proyectos con código
        privado aparecen sin enlaces.
      </p>
    </header>

    <section class="container" aria-label="Listado de proyectos">
      <div class="filters" data-filters data-enter style="--i:4"></div>
      <div id="projects-list" class="projects-grid" data-reveal-group></div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/projects-data.js"></script>
  <script src="/assets/js/projects-render.js"></script>
  <script>
    window.ProjectsUI.renderProjects("#projects-list");
    window.ProjectsUI.initFilters("[data-filters]", "#projects-list");
    window.Site.bootstrapPage("projects");
  </script>
</body>
</html>
